name: Deploy Frontend Application

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build \
            --build-arg VITE_API_URL=${{ secrets.VITE_API_URL }} \
            --build-arg VITE_WS_URL=${{ secrets.VITE_WS_URL }} \
            -t himanshhhh/eventa-frontend:latest .

      - name: Push Image to Docker Hub
        run: docker push himanshhhh/eventa-frontend:latest

  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - name: Pull Image from Docker Hub
        run: docker pull himanshhhh/eventa-frontend:latest

      - name: Delete Old Container
        run: docker rm -f eventa-frontend-container || true

      - name: Run Docker Container
        run: |
          docker run -d \
            -p 3000:80 \
            --name eventa-frontend-container \
            --restart unless-stopped \
            himanshhhh/eventa-frontend:latest